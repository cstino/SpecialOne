
[functions.simula-giornata]
enabled = true
# L'autenticazione la fa la libreria dentro la funzione: JWT utente oppure
# CRON_SECRET nell'header apikey. Col gateway attivo il cron non potrebbe
# presentarsi, perche' le chiavi nuove sb_secret_ non sono JWT.
verify_jwt = false
import_map = "./functions/simula-giornata/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/simula-giornata/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/simula-giornata/*.html" ]
